name: nextgallery-android

x-android-image: &android-image
  image: nextgallery/android-dev:local
  build:
    context: .
    dockerfile: Dockerfile

x-emulator: &emulator
  <<: *android-image
  entrypoint: ["/opt/nextgallery/bin/emulator-entrypoint.sh"]
  devices:
    - /dev/kvm:/dev/kvm
  group_add:
    - "${KVM_GID:-104}"
  ports:
    - "10.9.0.1:5555:5555"
  cpus: 4.0
  mem_limit: 5g
  shm_size: 256m
  tmpfs:
    - /tmp:size=512m,mode=1777
  healthcheck:
    test: ["CMD-SHELL", "adb -s emulator-5556 shell getprop sys.boot_completed 2>/dev/null | grep -q '^1$'"]
    interval: 5s
    timeout: 5s
    start_period: 30s
    retries: 36
  restart: "no"

services:
  builder:
    <<: *android-image
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - gradle-cache:/home/android/.gradle
    environment:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_USER_HOME: /home/android/.gradle

  emulator-smoke:
    <<: *emulator
    profiles: ["smoke"]
    environment:
      EMULATOR_WIPE_DATA: "1"
      EMULATOR_GPU_MODE: "${EMULATOR_GPU_MODE:-swiftshader}"
      EMULATOR_SCREEN_SIZE: "${EMULATOR_SCREEN_SIZE:-1080x2340}"
      EMULATOR_SCREEN_DENSITY: "${EMULATOR_SCREEN_DENSITY:-450}"
      EMULATOR_DISABLE_VULKAN: "${EMULATOR_DISABLE_VULKAN:-0}"

  emulator-dev:
    <<: *emulator
    profiles: ["dev"]
    environment:
      EMULATOR_WIPE_DATA: "0"
      EMULATOR_GPU_MODE: "${EMULATOR_GPU_MODE:-swiftshader}"
      EMULATOR_SCREEN_SIZE: "${EMULATOR_SCREEN_SIZE:-1080x2340}"
      EMULATOR_SCREEN_DENSITY: "${EMULATOR_SCREEN_DENSITY:-450}"
      EMULATOR_DISABLE_VULKAN: "${EMULATOR_DISABLE_VULKAN:-0}"
    volumes:
      - avd-data:/home/android/.android/avd

volumes:
  gradle-cache:
  avd-data:
