name: Android build and unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release tooling
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Run checks and compile instrumentation tests
        run: |
          ./gradlew verifyFeatureBoundaries :core:media:test :app:testAutomationUnitTest \
            :app:compileAutomationAndroidTestKotlin --no-daemon
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/testAutomationUnitTest/
            core/media/build/reports/tests/
            core/media/build/test-results/
          retention-days: 7
          overwrite: true
