name: Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build metadata
        id: version
        run: |
          python3 tools/ci/version.py metadata >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "label=${GITHUB_RUN_NUMBER}-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build test APK
        env:
          PREVIEW_LABEL: ${{ steps.version.outputs.label }}
        run: ./gradlew :app:assemblePreview "-PnextgalleryPreviewLabel=$PREVIEW_LABEL" --no-daemon
      - name: Prepare test APK
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          PREVIEW_LABEL: ${{ steps.version.outputs.label }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/preview/app-preview.apk \
            "dist/NextGallery-$APP_VERSION-preview-$PREVIEW_LABEL.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - name: Upload test APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: NextGallery-preview-${{ steps.version.outputs.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: APK download link
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          echo "[Скачать NextGallery Test]($ARTIFACT_URL) — commit $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
