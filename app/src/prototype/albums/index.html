<!doctype html>
<!-- Одноразовый UI-прототип: как показать серверные альбомы и локальные папки? Три структуры на одной странице, ?variant=A|B|C. Запуск: python -m http.server 8765 --directory app/src/prototype/albums -->
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NextGallery · Альбомы / прототип</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeedf2;color:#24212a;font:15px system-ui,sans-serif}button,select{font:inherit;cursor:pointer}button{color:inherit;border:0;background:none}button:focus-visible,a:focus-visible{outline:3px solid #8062bc;outline-offset:3px}main{max-width:1060px;margin:44px auto 100px;display:grid;grid-template-columns:1fr 400px;gap:80px;padding:0 24px}aside{padding-top:30px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#78658f}h1{font-size:42px;line-height:1.08;letter-spacing:-1.8px;font-weight:600;margin:22px 0}aside p{line-height:1.65;color:#65606e}h2{font-size:28px;letter-spacing:-.7px;margin:16px 0}h3{font-size:17px;margin:22px 0 12px}.note{padding:16px;background:#e4dcef;border-radius:16px;margin:24px 0}.note p{margin:8px 0 0}.phone{position:relative;background:#fffbff;border:6px solid #29262e;border-radius:38px;height:810px;overflow:hidden;box-shadow:0 24px 60px #30263c24}.status{height:35px;padding:9px 22px;font-size:11px;display:flex;justify-content:space-between;font-weight:600}.screen{height:calc(100% - 107px);overflow:auto;scrollbar-width:none;padding:8px 18px 22px}.brand{display:flex;justify-content:space-between;align-items:center;margin:8px 0 26px;font-size:19px}.avatar{background:#eaddff;color:#66508a;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:12px}.sub{color:#777080;font-size:12px;line-height:1.5}.chips{display:flex;gap:7px;overflow:auto;margin:20px 0}.chip{white-space:nowrap;border:1px solid #d8d0df;border-radius:24px;padding:8px 14px;font-size:12px}.chip.active{background:#e8def8;border-color:#e8def8;color:#59417e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}.card{text-align:left;padding:0;min-width:0}.cover{position:relative;height:145px;overflow:hidden;border-radius:17px;background:#ddd4e8}.cover img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;bottom:8px;left:8px;padding:4px 7px;border-radius:8px;background:#fffbffef;font-size:10px}.name{font-size:15px;font-weight:600;margin-top:8px}.row{width:100%;padding:12px 0;display:flex;align-items:center;text-align:left;gap:13px;border-bottom:1px solid #eee7f0}.row img{width:58px;height:58px;object-fit:cover;border-radius:12px}.row .text{flex:1}.row .name{margin:0 0 4px}.nav{height:72px;background:#f2edf6;display:flex;justify-content:space-around;align-items:center}.nav button{font-size:11px;min-width:100px}.nav span{display:block;font-size:20px;margin-bottom:4px}.nav .selected span{background:#e5d8f5;border-radius:30px;padding:3px 24px;color:#604887}.hero{position:relative;width:100%;height:200px;border-radius:22px;overflow:hidden;text-align:left;color:white;padding:20px;display:flex;flex-direction:column;justify-content:flex-end}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.65)}.hero>*:not(img){position:relative}.hero strong{font-size:25px}.hero small{margin-top:6px}.link{color:#705298;font-size:13px;padding:8px 0}.notice{background:#f0eaf6;padding:12px;border-radius:12px;font-size:12px;line-height:1.6;margin:12px 0}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:14px -14px}.tile{padding:0;position:relative;height:117px}.tile img{width:100%;height:100%;object-fit:cover}.tile small{position:absolute;bottom:4px;right:4px;background:#201b27ad;color:#fff;border-radius:4px;padding:2px 4px;font-size:10px}.back{font-size:14px;padding:8px 0;color:#72568d}.viewer{position:absolute;inset:35px 0 0;background:#131116;color:white;z-index:2;display:flex;flex-direction:column;padding:16px}.viewer img{width:100%;height:460px;object-fit:contain;margin:auto 0}.viewer header{display:flex;justify-content:space-between}.viewer footer{padding:20px 0}.viewer .sub{color:#c3baca}.pager{display:flex;justify-content:space-between;margin:16px 0}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#29232f;color:white;border-radius:30px;padding:8px;box-shadow:0 8px 28px #20192f30;z-index:5;white-space:nowrap}.switcher button{color:white;border-radius:50%;width:38px;height:38px;background:#453a51}.switcher label{font-size:12px;min-width:190px;text-align:center}details{margin-top:24px;font-size:12px;color:#777080}pre{white-space:pre-wrap;font-size:11px;line-height:1.6}select{border:1px solid #d4cadf;background:#fffbff;padding:10px;border-radius:10px;width:100%;margin-top:8px}.hint{font-size:12px;color:#81778c;margin-top:26px}.empty{padding:40px 10px;text-align:center;color:#777080}@media(max-width:760px){main{display:flex;flex-direction:column;gap:20px;margin:16px auto 100px;padding:0 12px;align-items:center}aside{max-width:390px;padding:0}h1{font-size:28px;margin:12px 0}aside p{font-size:13px}.note{margin:12px 0;padding:12px}.phone{width:min(400px,100%);height:780px;flex-shrink:0}details,.hint{display:none}}
</style>
<main><aside><div class="eyebrow">NEXTGALLERY / ПРОТОТИП 01</div><h1 id="headline"></h1><p id="description"></p><div class="note"><strong id="verdict"></strong><p id="tradeoff"></p></div><h3>Попробуй сценарий</h3><p id="scenario"></p><label class="sub">Состояние источников<select id="condition"><option value="normal">Всё доступно</option><option value="offline">Nextcloud недоступен</option><option value="partial">Разрешён доступ к части фото</option><option value="empty">Пустая библиотека</option></select></label><details open><summary>Состояние прототипа</summary><pre id="state"></pre></details><p class="hint">Вымышленные данные. Вариант C и общий доступ — продуктовые гипотезы, возможности API ещё не проверены. Изображения: Unsplash, сохранены локально. Это браузерный эскиз Android-интерфейса, не реализация приложения.</p></aside><section class="phone"><div class="status"><span>9:41</span><span>● Wi-Fi ▰</span></div><div class="screen" id="screen"></div><nav class="nav"><button id="timeline"><span>▦</span>Фото</button><button id="albums" class="selected"><span>▣</span>Альбомы</button></nav><div id="overlay"></div></section></main><div class="switcher"><button id="prev" aria-label="Предыдущий вариант">←</button><label id="variantlabel"></label><button id="next" aria-label="Следующий вариант">→</button></div>
<script>
const albums=[
{id:'trip-cloud',name:'Отпуск',source:'cloud',kind:'Альбом Nextcloud',path:'Личная подборка',photos:[0,1,2,3,4,5],cover:3},
{id:'camera',name:'Камера',source:'local',kind:'Папка телефона',path:'DCIM/Camera · внутренняя память',photos:[0,2,4],cover:0},
{id:'trip-local',name:'Отпуск',source:'local',kind:'Папка телефона',path:'Pictures/Отпуск · внутренняя память',photos:[0,1,6],cover:1},
{id:'shared',name:'Выходные у озера',source:'cloud',kind:'Общий альбом',path:'От Анны · только просмотр',photos:[3,5],cover:5},
{id:'screens',name:'Снимки экрана',source:'local',kind:'Папка телефона',path:'Pictures/Screenshots · внутренняя память',photos:[6,7],cover:6},
{id:'trip-sd',name:'Отпуск',source:'local',kind:'Папка телефона',path:'Pictures/Отпуск · SD-карта',photos:[2,5],cover:2}];
const titles=['Горная тропа','Берег моря','Лес','Озеро','Вершина','У воды','Билет на поезд','Бронь отеля'];
const copy={A:['A · Общий каталог','Всё рядом.\nИсточник виден.','Альбомы Nextcloud и папки телефона в одной сетке. Быстрый вход в любую группу без переключения разделов.','Меньше переходов','Но три «Отпуска» стоят рядом: происхождение и путь приходится читать на карточках.','Открой два «Отпуска»: одинаковое имя не означает одинаковый состав. Фильтры сужают каталог, не объединяют группы.'],B:['B · Раздельные разделы','Альбомы — подборки.\nПапки — на телефоне.','Один вход «Альбомы», внутри два раздела. Подборки Nextcloud получают обложки, папки телефона — компактный список с путями.','Я бы начал с этого','Разные правила состава понятны до открытия. Цена — один дополнительный тап, чтобы перейти к папкам телефона.','Открой «Отпуск», затем первый снимок: он есть на телефоне и в Nextcloud. Вернись и открой «На телефоне» — папки с тем же именем остаются отдельными.'],C:['C · Коллекции','Одна поездка.\nНесколько источников.','Поверх альбомов и папок появляется личная коллекция. Пользователь сам выбирает, какие группы показывать вместе.','Гипотеза для следующего шага','Удобно для поездок, но появляется новая сущность: нужно объяснять состав, пересечения и обновления. Объединение здесь не синхронизирует источники.','Открой коллекцию «Лето в дороге». Посмотри её источники, убери папку телефона и сравни состав. Совпадающие фото показаны один раз.']};
let variant=new URLSearchParams(location.search).get('variant')||'B';if(!copy[variant])variant='B';let filter='all',tab='cloud',condition='normal',selected=null,photo=null,collectionSources=['trip-cloud','trip-local'],sourcesOpen=false,page='albums',savedScroll=0,albumScroll=0;
const $=id=>document.getElementById(id),img=i=>`assets/${i===6||i===7?0:i}.`+(i===6||i===7?'svg':'jpg');
function media(a){let ids=a.id==='collection'?[...new Set(collectionSources.flatMap(id=>albums.find(a=>a.id===id).photos))]:a.photos;return condition==='partial'&&a.source==='local'?ids.slice(0,1):ids}
function items(){return condition==='empty'?[]:albums}
function card(a){return `<button class="card" data-open="${a.id}"><div class="cover"><img src="${img(a.cover)}" alt=""><span class="badge">${a.source==='local'?'▣ Телефон':a.id==='shared'?'♧ Общий':'☁ Nextcloud'}</span></div><div class="name">${a.name}</div><div class="sub">${media(a).length} фото${condition==='partial'&&a.source==='local'?' доступно':''}</div>${a.source==='local'?`<div class="sub">${a.path}</div>`:''}</button>`}
function row(a){return `<button class="row" data-open="${a.id}"><img src="${img(a.cover)}" alt=""><span class="text"><span class="name">${a.name}</span><span class="sub" style="display:block">${a.path}<br>${media(a).length} фото${condition==='partial'?' доступно':''}</span></span><span>›</span></button>`}
function collection(){return {id:'collection',name:'Лето в дороге',source:'mixed',kind:'Личная коллекция',path:'Объединённый просмотр выбранных источников',cover:3}}
function render(){let c=copy[variant];$('headline').innerText=c[1];$('description').textContent=c[2];$('verdict').textContent=c[3];$('tradeoff').textContent=c[4];$('scenario').textContent=c[5];$('variantlabel').textContent=c[0];let html='<div class="brand">NextGallery<span class="avatar">Н</span></div>';
if(condition==='offline')html+='<div class="notice">Нет связи с Nextcloud. Показан сохранённый список. Облачные оригиналы могут быть недоступны.</div>';
if(condition==='partial')html+='<div class="notice">Видны только разрешённые фото. Папки и их счётчики могут быть неполными.</div>';
if(selected){let a=selected,ids=media(a);html=`<button class="back" id="back">← Альбомы</button><h2>${a.name}</h2><div class="sub">${a.kind} · ${ids.length} фото<br>${a.path}</div>`+(condition==='offline'?'<div class="notice">Сохранённый состав. Часть фото недоступна без сети.</div>':'')+(condition==='partial'?'<div class="notice">Доступ к телефону ограничен. Локальные копии могут быть скрыты.</div>':'');if(a.id==='collection'){html+=`<button class="link" id="sources">${collectionSources.length} источника · Настроить</button>`;if(sourcesOpen)html+='<div class="notice">'+albums.filter(a=>['trip-cloud','trip-local'].includes(a.id)).map(a=>`<label style="display:block;padding:8px 0"><input type="checkbox" data-source="${a.id}" ${collectionSources.includes(a.id)?'checked':''}> ${a.name} · ${a.kind}</label>`).join('')+'Состав исходных альбомов и папок не меняется.</div>'}html+=`<h3>Лето 2026</h3><div class="photos">${ids.map((i,n)=>`<button class="tile" data-photo="${n}" aria-label="${titles[i]}"><img src="${img(i)}" alt="${titles[i]}"><small>${local(i)?'▣':'☁'}</small></button>`).join('')}</div>`;if(!ids.length)html+='<div class="empty">Выбери хотя бы один источник</div>';
}else if(page==='timeline'){html+='<h2>Фото</h2><div class="sub">Единая лента · 8 фото</div><h3>Лето 2026</h3><div class="photos">'+(condition==='empty'?[]:Array.from({length:8},(_,i)=>i)).map((i,n)=>`<button class="tile" data-timeline-photo="${n}" aria-label="${titles[i]}"><img src="${img(i)}" alt="${titles[i]}"></button>`).join('')+'</div>';
}else{html+='<h2>Альбомы</h2>';if(variant==='A'){html+='<div class="sub">Подборки и папки в одном месте</div><div class="chips">'+[['all','Все'],['cloud','Nextcloud'],['local','Телефон']].map(([id,t])=>`<button class="chip ${filter===id?'active':''}" data-filter="${id}">${t}</button>`).join('')+'</div><div class="grid">'+items().filter(a=>filter==='all'||a.source===filter).map(card).join('')+'</div>'}if(variant==='B'){html+='<div class="chips">'+[['cloud','Подборки'],['local','На телефоне']].map(([id,t])=>`<button class="chip ${tab===id?'active':''}" data-tab="${id}">${t}</button>`).join('')+'</div>';html+=tab==='cloud'?'<div class="sub" style="margin-bottom:16px">Альбомы из Nextcloud</div><div class="grid">'+items().filter(a=>a.source==='cloud'&&a.id!=='shared').map(card).join('')+'</div><h3>Со мной поделились</h3>'+items().filter(a=>a.id==='shared').map(row).join(''):'<div class="sub">Папки с доступными фото и видео</div>'+items().filter(a=>a.source==='local').map(row).join('')}if(variant==='C'){html+='<div class="sub" style="margin-bottom:20px">Собери связанные истории вместе</div>';if(items().length)html+='<button class="hero" data-open="collection"><img src="assets/3.jpg" alt=""><strong>Лето в дороге</strong><small>'+media(collection()).length+' фото · '+collectionSources.length+' источника</small></button>';html+='<h3>Источники</h3>'+items().map(row).join('')}if(!items().length)html+='<div class="empty">Здесь появятся альбомы и папки<br><br>Пока нет доступных фото</div>'}
$('screen').innerHTML=html;$('albums').classList.toggle('selected',page==='albums');$('timeline').classList.toggle('selected',page==='timeline');renderViewer();$('state').textContent=JSON.stringify({variant,page,condition,filter,tab,container:selected?.id||null,sequence:selected?media(selected):null,photo:photo===null?null:media(selected)[photo],collectionSources,identity:'В fixture совпадение MediaId задано явно; AUID/BUID не проверяются',savedScroll},null,2)}
function local(i){return condition!=='empty'&&(condition==='partial'?i===0:[0,1,2,4,6,7].includes(i))}
function renderViewer(){if(photo===null){$('overlay').innerHTML='';return}let ids=media(selected),i=ids[photo],available=condition!=='offline'||local(i);$('overlay').innerHTML=`<div class="viewer"><header><button id="closephoto">← Назад</button><span>${photo+1} / ${ids.length}</span></header>${available?`<img src="${img(i)}" alt="${titles[i]}">`:'<div class="empty" style="margin:auto">Оригинал в Nextcloud<br>Подключись к сети для просмотра</div>'}<footer><strong>${titles[i]}</strong><p class="sub">${local(i)?'Просмотр с телефона':'Оригинал в Nextcloud'}${i<6&&local(i)?' · Есть копия в Nextcloud':''}<br>Внутри: ${selected.name}</p><div class="pager"><button id="photoPrev" ${photo===0?'disabled':''}>← Предыдущее</button><button id="photoNext" ${photo===ids.length-1?'disabled':''}>Следующее →</button></div></footer></div>`}
function changeVariant(delta){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+delta+3)%3];let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);selected=null;photo=null;page='albums';render();$('screen').scrollTop=0}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.open){albumScroll=$('screen').scrollTop;selected=b.dataset.open==='collection'?collection():albums.find(a=>a.id===b.dataset.open);render();$('screen').scrollTop=0}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.photo!==undefined){savedScroll=$('screen').scrollTop;photo=+b.dataset.photo;render()}else if(b.dataset.timelinePhoto!==undefined){selected={id:'timeline',name:'Все фото',photos:[0,1,2,3,4,5,6,7]};photo=+b.dataset.timelinePhoto;render()}else if(b.id==='back'){selected=null;render();$('screen').scrollTop=albumScroll}else if(b.id==='closephoto'){photo=null;if(selected.id==='timeline')selected=null;render();$('screen').scrollTop=savedScroll}else if(b.id==='photoNext'){photo++;render()}else if(b.id==='photoPrev'){photo--;render()}else if(b.id==='sources'){sourcesOpen=!sourcesOpen;render()}else if(b.id==='prev'||b.id==='next')changeVariant(b.id==='next'?1:-1);else if(b.id==='timeline'||b.id==='albums'){page=b.id;selected=null;photo=null;render()}});
document.addEventListener('change',e=>{if(e.target.dataset.source){let id=e.target.dataset.source;collectionSources=e.target.checked?[...collectionSources,id]:collectionSources.filter(x=>x!==id);render()}});$('condition').onchange=e=>{condition=e.target.value;photo=null;if(condition==='empty')selected=null;render()};document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(photo!==null){photo=Math.max(0,Math.min(media(selected).length-1,photo+(e.key==='ArrowRight'?1:-1)));render()}else changeVariant(e.key==='ArrowRight'?1:-1)}if(e.key==='Escape'&&photo!==null)$('closephoto').click()});render();
</script><link rel="stylesheet" href="designs.css"><script src="designs.js"></script></html>
